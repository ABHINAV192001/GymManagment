version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: gymmanagment
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-1234}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASS:-}

volumes:
  pgdata:
