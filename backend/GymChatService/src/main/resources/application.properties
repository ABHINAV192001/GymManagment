spring.application.name=GymChatService
server.port=8082
server.max-http-header-size=${SERVER_MAX_HTTP_HEADER_SIZE:65536}
server.tomcat.max-http-header-size=${SERVER_MAX_HTTP_HEADER_SIZE:65536}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymmanagment}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

