spring.application.name=GymUserManagement

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymmanagment}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# NOTE: left as `update` rather than `validate` - the Flyway V1 baseline is an empty stub
# (schema was never actually dumped into it), so switching to `validate` here without first
# confirming the live schema matches every entity mapping risks the app failing to start.
# See MIGRATION_NOTES in db/migration for the safe path to `validate`.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# JWT Configuration
# Must be identical across all 4 services (see .env.example) or cross-service token validation breaks
jwt.secret=${JWT_SECRET:default_dev_secret_key_needs_to_be_long_enough_for_hs256}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Server Configuration
server.port=8080

# Twilio Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# GymCommonServices Compatibility
application.security.jwt.secret-key=${JWT_SECRET:default_dev_secret_key_needs_to_be_long_enough_for_hs256}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abhinavsahu120@gmail.com}
spring.mail.password=${MAIL_PASSWORD:vwccsddnzklnsgrn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true