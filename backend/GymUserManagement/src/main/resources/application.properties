spring.application.name=GymUserManagement
server.max-http-header-size=${SERVER_MAX_HTTP_HEADER_SIZE:65536}
server.tomcat.max-http-header-size=${SERVER_MAX_HTTP_HEADER_SIZE:65536}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/gymmanagment}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS:1234}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
# NOTE: left as `update` rather than `validate` - the Flyway V1 baseline is an empty stub
# (schema was never actually dumped into it), so switching to `validate` here without first
# confirming the live schema matches every entity mapping risks the app failing to start.
# See MIGRATION_NOTES in db/migration for the safe path to `validate`.
# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,https://gym-managment-rho-one.vercel.app,https://*.vercel.app}

# JWT Configuration
# Must be identical across all 4 services (see .env.example) or cross-service token validation breaks
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Server Configuration
server.port=${PORT:8080}


# Twilio Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# GymCommonServices Compatibility
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

